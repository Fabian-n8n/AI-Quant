[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    alpaca: hits the live Alpaca paper API; skipped without credentials
filterwarnings =
    error::UserWarning
    # hmmlearn 0.3.3 sets .shape on a NumPy array, deprecated in NumPy 2.5.
    # Upstream issue, nothing to fix here, and it fires thousands of times.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    ignore::DeprecationWarning:hmmlearn.*
    # alpaca-py 0.44 still imports websockets.legacy internally.
    ignore:websockets.legacy is deprecated:DeprecationWarning
