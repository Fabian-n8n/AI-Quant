name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# The Alpaca-marked tests skip automatically without credentials, so CI runs the
# offline suite only. Adding secrets here would mean every PR from a fork could
# place orders on a paper account, which is not a trade worth making.
jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

      # Reported, not enforced. It is expected to fail: the strategy has no
      # closed paper trades and loses to buy-and-hold out-of-sample. Failing CI
      # on it would mean a red build on every commit, which trains people to
      # ignore red builds. The gate that matters is in main.py, where live mode
      # actually refuses to start.
      - name: Live-readiness preflight (informational)
        continue-on-error: true
        run: python scripts/preflight.py

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
